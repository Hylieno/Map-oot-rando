name: Windows portable preview
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'map_oot_rando/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'packaging/**'
      - '.github/workflows/windows.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install map dependencies
        run: python -m pip install -r requirements.txt
      - name: Tests including Tk
        env:
          MAP_REQUIRE_DISPLAY: '1'
        run: python -m unittest discover -s tests -v
      - uses: actions/checkout@v4
        with:
          repository: Mozencaz/OotrR
          ref: 283d3ec0f161d32e168afac45e502442c1ffb081
          path: upstream-ootrr
          persist-credentials: false
      - name: Install packager and scanner dependencies
        run: python -m pip install pyinstaller==6.11.1 'zstandard>=0.23,<1' 'evfl>=1.3,<2'
      - name: Build portable preview
        run: python -m PyInstaller --noconfirm --clean --windowed --onedir --name Map-oot-rando --paths . --paths upstream-ootrr/src packaging/launcher.py
      - name: Verify frozen scanner
        shell: pwsh
        run: |
          Set-Content -Path invalid.nup -Value 'Invalid test input'
          $app = Start-Process -FilePath dist/Map-oot-rando/Map-oot-rando.exe -ArgumentList '--check-bundled-import', 'invalid.nup' -Wait -PassThru
          if ($app.ExitCode -ne 0) { exit $app.ExitCode }
      - name: Include usage and limitations
        shell: pwsh
        run: |
          Copy-Item upstream-ootrr/LICENSE dist/Map-oot-rando/OotrR-LICENSE.txt
          Copy-Item README.md dist/Map-oot-rando/
          Copy-Item docs/TESTING.md dist/Map-oot-rando/
      - uses: actions/upload-artifact@v4
        with:
          name: Map-oot-rando-windows-x64-preview
          path: dist/Map-oot-rando/
          if-no-files-found: error
          retention-days: 14
