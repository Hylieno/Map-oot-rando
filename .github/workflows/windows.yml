name: Windows portable
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'map_oot_rando/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'packaging/**'
      - '.github/workflows/windows.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Decide whether to package Windows
        id: packaging
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          $package = $env:EVENT_NAME -in @('push', 'workflow_dispatch')
          if (-not $package -and $env:PR_HEAD) {
            $subject = git log -1 --format=%s $env:PR_HEAD
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $package = $subject.EndsWith('[preview]', [System.StringComparison]::Ordinal)
          }
          "package=$($package.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install map dependencies
        run: python -m pip install -r requirements.txt
      - uses: actions/checkout@v4
        with:
          repository: Mozencaz/OotrR
          ref: 9bdc6d36dac7a659afd75441884f0ef3d25db4f2
          path: upstream-ootrr
          persist-credentials: false
      - name: Install scanner dependencies
        run: python -m pip install 'zstandard>=0.23,<1' 'evfl>=1.3,<2' 'ainb==0.2.17'
      - name: Tests including Tk
        env:
          MAP_REQUIRE_DISPLAY: '1'
          PYTHONPATH: upstream-ootrr/src
        run: python -m unittest discover -s tests -v
      - name: Install packager
        if: steps.packaging.outputs.package == 'true'
        run: python -m pip install pyinstaller==6.11.1
      - name: Build portable app
        if: steps.packaging.outputs.package == 'true'
        run: python -m PyInstaller --noconfirm --clean --windowed --onedir --name Map-oot-rando --copy-metadata resvg-py --add-data "upstream-ootrr/src/oot_rando/logic/world:oot_rando/logic/world" --add-data "map_oot_rando/assets/welcome.jpg:map_oot_rando/assets" --paths . --paths upstream-ootrr/src packaging/launcher.py
      - name: Verify frozen scanner
        if: steps.packaging.outputs.package == 'true'
        shell: pwsh
        env:
          PYTHONPATH: upstream-ootrr/src
        run: |
          python packaging/import_fixture.py scanner-fixture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item Env:PYTHONPATH
          $app = Start-Process -FilePath dist/Map-oot-rando/Map-oot-rando.exe -ArgumentList '--check-bundled-import', 'scanner-fixture/synthetic.nup', 'scanner-fixture/checks.json' -Wait -PassThru
          if ($app.ExitCode -ne 0) { exit $app.ExitCode }
      - name: Verify frozen map window
        if: steps.packaging.outputs.package == 'true'
        shell: pwsh
        run: |
          $app = Start-Process -FilePath dist/Map-oot-rando/Map-oot-rando.exe -ArgumentList '--check-bundled-gui', 'scanner-fixture/synthetic.nup', 'scanner-fixture/checks.json' -Wait -PassThru
          if ($app.ExitCode -ne 0) { exit $app.ExitCode }
      - name: Include usage and limitations
        if: steps.packaging.outputs.package == 'true'
        shell: pwsh
        run: |
          Copy-Item upstream-ootrr/LICENSE dist/Map-oot-rando/OotrR-LICENSE.txt
          Copy-Item README.md dist/Map-oot-rando/
          Copy-Item docs/TESTING.md dist/Map-oot-rando/
      - uses: actions/upload-artifact@v4
        if: steps.packaging.outputs.package == 'true'
        with:
          name: ${{ github.ref == 'refs/heads/main' && 'Map-oot-rando-windows-x64' || 'Map-oot-rando-windows-x64-preview' }}
          path: dist/Map-oot-rando/
          if-no-files-found: error
          retention-days: 14
