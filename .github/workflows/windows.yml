name: Windows portable preview
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'map_oot_rando/**'
      - 'tests/**'
      - 'packaging/**'
      - '.github/workflows/windows.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Tests including Tk
        env:
          MAP_REQUIRE_DISPLAY: '1'
        run: python -m unittest discover -s tests -v
      - name: Install packager
        run: python -m pip install pyinstaller==6.11.1
      - name: Build portable preview
        run: python -m PyInstaller --noconfirm --clean --windowed --onedir --name Map-oot-rando --paths . packaging/launcher.py
      - name: Include usage and limitations
        shell: pwsh
        run: |
          Copy-Item README.md dist/Map-oot-rando/
          Copy-Item docs/TESTING.md dist/Map-oot-rando/
      - uses: actions/upload-artifact@v4
        with:
          name: Map-oot-rando-windows-x64-preview
          path: dist/Map-oot-rando/
          if-no-files-found: error
          retention-days: 14
