name: Publish Windows release
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Windows portable build run on main
        required: true
        type: string
      tag:
        description: Release version, for example v0.1.0
        required: true
        type: string
      notes:
        description: Release notes in Markdown
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN: ${{ inputs.run_id }}
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_NOTES: ${{ inputs.notes }}
    steps:
      - name: Publish the verified Windows build
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN" =~ ^[0-9]+$ && "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          build="$(gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN")"
          commit="$(jq -er --arg repo "$GH_REPO" '
            select(.path == ".github/workflows/windows.yml"
              and .head_repository.full_name == $repo and .head_branch == "main"
              and .event == "push" and .status == "completed" and .conclusion == "success")
            | .head_sha
          ' <<< "$build")"
          cd "$RUNNER_TEMP"
          gh run download "$BUILD_RUN" --name Map-oot-rando-windows-x64 --dir Map-oot-rando
          test -f Map-oot-rando/Map-oot-rando.exe
          test -f Map-oot-rando/OotrR-LICENSE.txt
          archive="Map-oot-rando-$RELEASE_TAG-windows-x64.zip"
          zip -qr "$archive" Map-oot-rando
          unzip -tq "$archive"
          printf '%s\n' "$RELEASE_NOTES" > release-notes.md
          gh release create "$RELEASE_TAG" "$archive" --target "$commit" \
            --title "Map-oot-rando $RELEASE_TAG" --notes-file release-notes.md --latest
